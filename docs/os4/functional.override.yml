services:
  backup-os4:
    image: ecoute-os3-backup:latest
    profiles: [tools]
    environment:
      PGHOST: db
      PGDATABASE: feedback
      PGUSER: postgres
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
      BACKUP_KEY: ${BACKUP_KEY}
    volumes:
      - ./:/app/os4
      - ../../scripts:/app/scripts:ro
    networks: [isolated]
    command: [python3, /app/scripts/os4_backup.py]
  proxy:
    image: ecoute-os4-functional-proxy:latest
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.proxy
    ports: !override ['127.0.0.1:8085:8080']
networks:
  isolated:
    internal: false
