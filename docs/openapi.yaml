          content:
            application/json:
              schema:
                type: object
          description: ''
components:
  schemas:
    Action:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        project:
          type: string
          maxLength: 80
        owner:
          type: integer
        owner_name:
          type: string
          readOnly: true
        due:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          default: PLANIFIEE
        proof:
          type: string
        dossiers:
          type: array
          items:
            type: string
            format: uuid
        restitutions:
          type: array
          items:
            $ref: '#/components/schemas/Restitution'
          readOnly: true
      required:
      - due
      - id
      - owner
      - owner_name
      - project
      - restitutions
      - title
    AgentBatch:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Input'
      required:
      - items
    Input:
      type: object
      properties:
        text:
          type: string
          maxLength: 8000
        address:
          type: string
          maxLength: 120
        consent:
          type: boolean
          default: false
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          default: PLAINTE
        zone:
          type: string
          default: Non précisée
          maxLength: 80
        project:
          type: string
          default: Assistance communautaire
          maxLength: 80
        language:
          type: string
          default: fr
          maxLength: 10
        sensitive:
          type: boolean
          default: false
        key:
          type: string
          maxLength: 120
      required:
      - text
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
        otp:
          type: string
      required:
      - password
      - username
    Note:
      type: object
      properties:
        text:
          type: string
        attempt:
          type: boolean
      required:
      - text
    PatchedAction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        project:
          type: string
          maxLength: 80
        owner:
          type: integer
        owner_name:
          type: string
          readOnly: true
        due:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          default: PLANIFIEE
        proof:
          type: string
        dossiers:
          type: array
          items:
            type: string
            format: uuid
        restitutions:
          type: array
          items:
            $ref: '#/components/schemas/Restitution'
          readOnly: true
    PatchedQualification:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        theme:
          type: string
          maxLength: 80
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        zone:
          type: string
          maxLength: 80
        project:
          type: string
          maxLength: 80
        sensitive:
          type: boolean
          default: false
    Refresh:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    ReplyDraft:
      type: object
      properties:
        text:
          type: string
      required:
      - text
    ReplyValidation:
      type: object
      properties:
        accepted:
          type: boolean
        reason:
          type: string
      required:
      - accepted
    Restitution:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        channel:
          type: string
          maxLength: 40
        zone:
          type: string
          maxLength: 80
        message:
          type: string
      required:
      - channel
      - date
      - id
      - message
      - zone
    StatusEnum:
      enum:
      - PLANIFIEE
      - EN_COURS
      - REALISEE
      type: string
      description: |-
        * `PLANIFIEE` - PLANIFIEE
        * `EN_COURS` - EN_COURS
        * `REALISEE` - REALISEE
    Transition:
      type: object
      properties:
        state:
          type: string
          maxLength: 30
        reason:
          type: string
          maxLength: 500
        owner:
          type: integer
        recipient:
          type: string
          maxLength: 200
        receipt:
          type: string
          maxLength: 500
      required:
      - state
    TypeEnum:
      enum:
      - QUESTION
      - PLAINTE
      - SUGGESTION
      - SATISFACTION
      type: string
      description: |-
        * `QUESTION` - QUESTION
        * `PLAINTE` - PLAINTE
        * `SUGGESTION` - SUGGESTION
        * `SATISFACTION` - SATISFACTION
    UrgencyEnum:
      enum:
      - NORMALE
      - URGENTE
      type: string
      description: |-
        * `NORMALE` - NORMALE
        * `URGENTE` - URGENTE
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: Jeton court obtenu par /auth/login ; renouvellement rotatif.
