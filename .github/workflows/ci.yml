name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend deploy scripts
      - run: PYTHONPATH=backend lint-imports
      - run: pytest --cov=core --cov-fail-under=70
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip-audit -r backend/requirements.txt
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: docker build -f deploy/Dockerfile.api .
      - run: docker build -f deploy/Dockerfile.proxy .
      - run: docker build -f deploy/Dockerfile.backup .
